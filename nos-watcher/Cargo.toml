[package]
name = "nos-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
dotenvy      = "0.15"
chrono       = { version = "0.4", features = ["serde"] }
sha2         = "0.10"
hex          = "0.4"
