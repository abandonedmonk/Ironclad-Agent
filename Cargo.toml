[package]
name = "ironclad-runtime"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "agent", "nos-watcher"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
wasmtime = { version = "43.0.1", features = ["cache"] }
wasmtime-wasi = "43.0.1"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rig-core = "0.35.0"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"